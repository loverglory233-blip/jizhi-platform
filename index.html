<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>集智 (JIZHI) - 多智能体支持的协作写作平台</title>
  
  <!-- Critical Anti-FOUC Layout Guard (防止网络慢时页面布局闪烁错乱) -->
  <style>
    html, body {
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background-color: #f8fafc !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif !important;
    }
    #app-loading-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #f8fafc;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 999999;
      transition: opacity 0.25s ease-out;
    }
    .loading-spinner {
      width: 42px; height: 42px;
      border: 3.5px solid #e2e8f0;
      border-top-color: #0284c7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; font-weight: 700; color: #0f172a; letter-spacing: 0.5px; }
  </style>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- 启动防错乱加载保驾屏 -->
  <div id="app-loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-text">🌿 正在加载集智协作工作台...</div>
  </div>

  <div id="app"></div>

  <!-- Pure Standalone Bundle -->
  <script src="js/bundle.js"></script>

  <script>
    // 监听全量 JS/CSS 加载完毕后平滑关闭加载保驾屏
    window.addEventListener('load', function() {
      var loader = document.getElementById('app-loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.style.display = 'none'; }, 250);
      }
    });
  </script>
</body>
</html>
